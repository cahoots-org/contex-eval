[project]
name = "contexeval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "datasets", "mcp==2.0.0", "openai", "rank-bm25",
  # Pinned: sentence-transformers 3.x imports transformers.integrations.CodeCarbonCallback,
  # removed in transformers >=4.50; transformers 5.x breaks sentence-transformers entirely.
  # (mlx-lm, installed separately for the agent server, otherwise pulls transformers 5.x.)
  "sentence-transformers>=3.1,<4", "transformers>=4.44,<4.49",
  "numpy", "matplotlib",
  # NOTE: do NOT install torchvision — the version pulled transitively mismatches the
  # installed torch (torchvision::nms ABI error). It is not needed by this harness.
]
[project.optional-dependencies]
dev = ["pytest"]
[tool.setuptools.packages.find]
include = ["contexeval*"]
